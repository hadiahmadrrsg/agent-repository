<!DOCTYPE html>
<html lang="en">
<head>

<title>Agent Repository — Prototype</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Roboto','Segoe UI',sans-serif;min-height:100vh;background:#F5F6F8;color:#1A1A1A;display:flex}
h1,h2,h3{font-family:'Nunito',sans-serif}
::-webkit-scrollbar{width:5px}::-webkit-scrollbar-thumb{background:#ddd;border-radius:3px}
@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
.fadeUp{animation:fadeUp .35s ease both}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

#sidebar{width:236px;background:#fff;border-right:1px solid #E5E7EB;padding:16px 10px;display:flex;flex-direction:column;gap:3px;flex-shrink:0;height:100vh;position:sticky;top:0;overflow-y:auto}
.logo-row{display:flex;align-items:center;gap:10px;padding:10px 10px 18px;border-bottom:1px solid #E5E7EB;margin-bottom:12px}
.logo-icon{width:36px;height:36px;border-radius:10px;background:#EE4D2D;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.logo-title{font-family:'Nunito';font-size:15px;font-weight:900;letter-spacing:-.3px}
.vchip{display:inline-block;padding:2px 7px;border-radius:6px;background:#FFF1ED;color:#EE4D2D;font-family:'Nunito';font-size:9.5px;font-weight:900;letter-spacing:.3px;vertical-align:2px;margin-left:5px}
.vchip.big{font-size:11px;padding:3px 9px;background:#F3F4F6;color:#6B7280;vertical-align:3px}
.logo-sub{font-size:10px;color:#6B7280;font-weight:700;letter-spacing:.3px}
.nav-sect{font-size:10px;font-weight:800;color:#9CA3AF;letter-spacing:.8px;text-transform:uppercase;padding:12px 14px 6px;font-family:'Nunito'}
.nav-btn{display:flex;align-items:center;gap:10px;padding:11px 14px;border:none;border-radius:12px;font-size:13px;font-weight:700;cursor:pointer;width:100%;text-align:left;font-family:'Nunito';transition:all .2s;background:transparent;color:#6B7280}
.nav-btn:hover{background:#F3F4F6;color:#1A1A1A}
.nav-btn.active{background:#EE4D2D;color:#fff;box-shadow:0 4px 15px rgba(238,77,45,.25)}
.nav-btn:focus-visible{outline:2px solid #EE4D2D;outline-offset:2px}
.nav-btn .label{flex:1}
.nav-btn .count{padding:2px 9px;border-radius:20px;font-size:10px;font-weight:800;background:rgba(238,77,45,.1);color:#EE4D2D}
.nav-btn.active .count{background:rgba(255,255,255,.25);color:#fff}
.nav-btn .count.zero{background:#F3F4F6;color:#9CA3AF}
.nav-btn.adm-head{background:#F9FAFB;color:#374151;margin-top:6px}
.nav-btn.adm-head.open{background:#FFF1ED;color:#EE4D2D}
.nav-btn .chev{font-size:11px;width:11px;flex-shrink:0}
.adm-body{padding:4px 0 2px 10px;border-left:2px solid #FFD9CE;margin:3px 0 4px 16px;display:flex;flex-direction:column;gap:2px;animation:fadeUp .2s ease both}
.nav-btn.sub{padding:9px 12px;font-size:12.5px}

#main{flex:1;padding:26px 34px;overflow-y:auto;max-height:100vh}
.card{background:#fff;border-radius:16px;border:1px solid #E5E7EB;box-shadow:0 1px 3px rgba(0,0,0,.04);padding:22px;margin-bottom:14px}
.card-hover{transition:all .2s}.card-hover:hover{border-color:#EE4D2D;box-shadow:0 6px 24px rgba(238,77,45,.1)}
.pg-title{font-size:23px;font-weight:900;font-family:'Nunito';letter-spacing:-.4px;margin-bottom:3px}
.pg-sub{font-size:13px;color:#6B7280;margin-bottom:20px}
.badge{display:inline-block;padding:4px 11px;border-radius:20px;font-size:11px;font-weight:800;letter-spacing:.2px;font-family:'Nunito'}
.stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:13px;margin-bottom:20px}
.stat-label{font-size:11px;font-weight:800;color:#6B7280;text-transform:uppercase;letter-spacing:.6px;margin-bottom:10px;font-family:'Nunito'}
.stat-val{font-size:29px;font-weight:900;font-family:'Nunito';line-height:1}
.stat-note{font-size:11px;color:#9CA3AF;margin-top:6px}
.btn{padding:9px 18px;border-radius:10px;font-size:13px;font-weight:800;cursor:pointer;font-family:'Nunito';border:none;transition:all .15s}
.btn:focus-visible{outline:2px solid #EE4D2D;outline-offset:2px}
.btn-primary{background:#EE4D2D;color:#fff;box-shadow:0 4px 12px rgba(238,77,45,.25)}
.btn-primary:hover{background:#D6431F}
.btn-outline{border:1.5px solid #E5E7EB;background:#fff;color:#6B7280}
.btn-outline:hover{border-color:#EE4D2D;color:#EE4D2D}
.btn-done{background:#ECFDF5;color:#059669;border:1.5px solid #A7F3D0;cursor:default}
.btn-del{border:1.5px solid #FECACA;background:#fff;color:#DC2626}
.btn-del:hover{background:#FEF2F2}
.btn-xs{padding:6px 12px;font-size:11.5px;border-radius:8px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.inp{width:100%;padding:11px 14px;border-radius:10px;border:1.5px solid #E5E7EB;font-size:13px;font-family:inherit;outline:none;transition:border .2s;background:#fff}
.inp:focus{border-color:#EE4D2D;box-shadow:0 0 0 3px rgba(238,77,45,.1)}
.flab{display:block;font-family:'Nunito';font-size:11px;font-weight:800;color:#6B7280;text-transform:uppercase;letter-spacing:.5px;margin-bottom:5px}
.chip{padding:7px 14px;border-radius:20px;font-size:12px;font-weight:800;cursor:pointer;font-family:'Nunito';border:1.5px solid #E5E7EB;background:#fff;color:#6B7280;transition:all .15s}
.chip:hover{border-color:#EE4D2D;color:#EE4D2D}
.chip.on{background:#EE4D2D;border-color:#EE4D2D;color:#fff}
.entry{border:1px solid #E5E7EB;border-radius:14px;padding:18px 20px;margin-bottom:11px;background:#fff;transition:all .2s}
.entry:hover{border-color:#EE4D2D;box-shadow:0 6px 20px rgba(238,77,45,.08)}
.entry.done{background:#FAFAFA;border-color:#F0F0F0}
.entry-meta{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-bottom:9px}
.eid{font-family:monospace;font-size:11px;font-weight:700;color:#9CA3AF;letter-spacing:.5px}
.entry-title{font-family:'Nunito';font-size:15.5px;font-weight:800;line-height:1.45;margin-bottom:6px}
.entry-body{font-size:13.5px;color:#4B5563;line-height:1.65;margin-bottom:13px;white-space:pre-line}
.entry-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.gal{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:13px}
.nothumb{height:82px;width:112px;border-radius:9px;border:1px dashed #E5E7EB;display:flex;align-items:center;justify-content:center;font-size:10.5px;color:#9CA3AF;font-family:'Nunito';font-weight:700;background:#FAFAFA}
.playbtn{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:30px;height:30px;border-radius:50%;background:rgba(0,0,0,.6);color:#fff;display:flex;align-items:center;justify-content:center;font-size:12px;pointer-events:none}
.thumb{cursor:pointer}
.gal img,.gal video{height:82px;width:112px;object-fit:cover;border-radius:9px;border:1px solid #E5E7EB;cursor:pointer;background:#F3F4F6}
.thumb{position:relative;display:inline-block}
.thumb .x{position:absolute;top:-6px;right:-6px;width:21px;height:21px;border-radius:50%;background:#DC2626;color:#fff;border:2px solid #fff;font-size:12px;font-weight:800;cursor:pointer;line-height:1;display:flex;align-items:center;justify-content:center;padding:0}
.drop{border:2px dashed #E5E7EB;border-radius:12px;padding:15px;text-align:center;cursor:pointer;transition:all .2s;font-size:12.5px;color:#6B7280;font-family:'Nunito';font-weight:700}
.drop:hover{border-color:#EE4D2D;background:#FFF5F2;color:#EE4D2D}
.bar{height:7px;border-radius:4px;background:#F3F4F6;overflow:hidden}
.bar-fill{height:100%;border-radius:4px;background:#EE4D2D;transition:width .4s}
.mtx{border-collapse:separate;border-spacing:0;font-size:11px;width:100%}
.mtx th{font-family:'Nunito';font-weight:800;color:#6B7280;padding:7px 5px;text-align:center;font-size:10px;border-bottom:1.5px solid #E5E7EB;white-space:nowrap}
.mtx th.who{text-align:left;padding-left:2px;min-width:160px}
.mtx td{padding:5px;text-align:center;border-bottom:1px solid #F3F4F6}
.mtx td.who{text-align:left;font-size:12px;color:#374151;padding-left:2px;font-weight:500}
.dot{width:19px;height:19px;border-radius:6px;display:inline-flex;align-items:center;justify-content:center;font-size:11px;font-weight:800}
.dot.y{background:#ECFDF5;color:#059669}
.dot.n{background:#FEF2F2;color:#DC2626}
.mrow{display:flex;align-items:center;gap:14px;padding:13px 20px;border-bottom:1px solid #F3F4F6}
.mrow:last-child{border-bottom:none}
.mrow:hover{background:#FAFAFA}
.demo-bar{background:#113366;color:#fff;padding:9px 18px;border-radius:12px;display:flex;align-items:center;gap:14px;margin-bottom:18px;flex-wrap:wrap}
.demo-bar b{font-family:'Nunito';font-size:12px;font-weight:800;letter-spacing:.3px}
.demo-bar span{font-size:12px;opacity:.85}
#toast{position:fixed;top:20px;right:20px;z-index:999;padding:12px 16px 12px 20px;border-radius:12px;background:#1A1A1A;color:#fff;font-size:13px;font-weight:700;font-family:'Nunito';box-shadow:0 8px 30px rgba(0,0,0,.25);display:none;align-items:center;gap:14px;animation:fadeUp .3s ease}
#toast .u{background:rgba(255,255,255,.15);border:none;color:#fff;font-family:'Nunito';font-weight:800;font-size:12px;padding:6px 13px;border-radius:8px;cursor:pointer}
#toast .u:hover{background:rgba(255,255,255,.3)}
.empty{text-align:center;padding:52px 20px;color:#9CA3AF}
.empty-t{font-family:'Nunito';font-size:16px;font-weight:800;color:#6B7280;margin-bottom:5px}
.gate{position:fixed;inset:0;z-index:1000;background:#EE4D2D;display:flex;align-items:center;justify-content:center;padding:20px}
.gate-box{background:#fff;border-radius:24px;padding:44px 38px;max-width:410px;width:100%;box-shadow:0 30px 80px rgba(0,0,0,.3);text-align:center}
.sync{margin-top:8px;padding:8px 12px;border-radius:10px;font-size:11px;font-weight:700;background:#ECFDF5;color:#059669;display:flex;align-items:center;gap:6px;font-family:'Nunito'}
.sync i{width:7px;height:7px;border-radius:50%;background:#059669;flex-shrink:0;display:inline-block}
.lightbox{position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:2000;display:flex;align-items:center;justify-content:center;padding:40px;cursor:zoom-out}
.lightbox img,.lightbox video{max-width:100%;max-height:100%;border-radius:12px}
.bposw{display:flex;align-items:center;gap:8px;width:100%;padding:8px 10px;margin-top:6px;border-radius:11px;border:1.5px solid #E5E7EB;background:#fff;cursor:pointer;font-family:'Nunito';font-size:12px;font-weight:800;color:#374151;transition:all .15s}
.bposw:hover{border-color:#EE4D2D;color:#EE4D2D}
.bposw.locked{cursor:default;background:#F9FAFB;color:#9CA3AF;border-style:dashed}
.bposw.locked:hover{border-color:#E5E7EB;color:#9CA3AF}
.bposw .tick{margin-left:auto;font-size:11px}
.bpolist{display:flex;flex-direction:column;gap:2px;padding:5px 0 2px 8px;border-left:2px solid #FFD9CE;margin:4px 0 2px 12px;animation:fadeUp .2s ease both}
.bpoitem{text-align:left;border:none;background:transparent;padding:8px 11px;border-radius:9px;font-family:'Nunito';font-size:12px;font-weight:700;color:#6B7280;cursor:pointer}
.bpoitem:hover{background:#F3F4F6;color:#1A1A1A}
.bpoitem.on{background:#EE4D2D;color:#fff}
.nav-btn.sup-head{background:#F9FAFB;color:#374151;margin-top:4px}
.nav-btn.sup-head.open{background:#EEF2FF;color:#0053DE}
.adm-body.sup{border-left-color:#C7D7FE}
.ptab{width:100%;border-collapse:collapse;font-size:12.5px}
.ptab th{text-align:left;font-family:'Nunito';font-size:10.5px;font-weight:800;color:#9CA3AF;text-transform:uppercase;letter-spacing:.5px;padding:8px 10px;border-bottom:1.5px solid #E5E7EB}
.ptab td{padding:8px 10px;border-bottom:1px solid #F3F4F6;vertical-align:middle}
.ptab tr:hover td{background:#FAFAFA}
.ptab select{padding:5px 8px;border-radius:7px;border:1.5px solid #E5E7EB;font-family:'Nunito';font-size:11.5px;font-weight:700;background:#fff;cursor:pointer}
.rule{display:flex;align-items:center;gap:9px;padding:9px 12px;border:1px solid #E5E7EB;border-radius:10px;margin-bottom:7px;font-size:12.5px}
.kw{font-family:monospace;background:#F3F4F6;padding:3px 8px;border-radius:6px;font-size:12px;color:#1A1A1A}
.denied{max-width:430px;text-align:center}
.tog{display:inline-flex;align-items:center;gap:6px;padding:6px 11px;border-radius:20px;border:1.5px solid #E5E7EB;background:#fff;cursor:pointer;font-family:'Nunito';font-size:11.5px;font-weight:800;color:#9CA3AF;transition:all .15s}
.tog:hover{border-color:#EE4D2D}
.tog.on{background:#EE4D2D;border-color:#EE4D2D;color:#fff}
.tog .b{width:13px;height:13px;border-radius:4px;border:1.5px solid currentColor;display:inline-flex;align-items:center;justify-content:center;font-size:9px;line-height:1}
.bars{display:flex;align-items:flex-end;gap:5px;height:110px;padding-top:6px}
.bcol{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:5px;height:100%}
.bcol .v{width:100%;background:#EE4D2D;border-radius:5px 5px 2px 2px;min-height:2px;transition:height .4s}
.bcol .v.alt{background:#FFC5B4}
.bcol .l{font-size:9.5px;color:#9CA3AF;font-family:'Nunito';font-weight:700;white-space:nowrap}
.log{display:flex;align-items:center;gap:11px;padding:11px 14px;border-bottom:1px solid #F3F4F6;font-size:12.5px}
.log:last-child{border-bottom:none}
.log .ic{width:26px;height:26px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;font-family:'Nunito';flex-shrink:0}
.rank{display:flex;align-items:center;gap:10px;padding:9px 0}
.rank .n{width:20px;font-family:'Nunito';font-weight:900;font-size:12px;color:#D1D5DB}
.tf-bar{position:relative;display:flex;flex-direction:column;align-items:center;gap:4px;flex:1;min-width:0}
.tf-bar:hover .tf-tip{display:block}
.tf-tip{display:none;position:absolute;bottom:calc(100% + 8px);left:50%;transform:translateX(-50%);background:#111827;color:#fff;border-radius:9px;padding:9px 12px;font-size:11px;min-width:150px;max-width:250px;z-index:60;box-shadow:0 8px 24px rgba(0,0,0,.3);text-align:left;pointer-events:none;line-height:1.5}
.tf-tip .ar{position:absolute;top:100%;left:50%;transform:translateX(-50%);border:6px solid transparent;border-top-color:#111827}
.heat{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:2px;position:relative}
.heat:hover .tf-tip{display:block}
.modal-wrap{position:fixed;inset:0;background:rgba(17,24,39,.55);z-index:1500;display:flex;align-items:flex-start;justify-content:center;padding:40px 20px;overflow-y:auto}
.modal{background:#fff;border-radius:18px;max-width:720px;width:100%;box-shadow:0 30px 80px rgba(0,0,0,.3);animation:fadeUp .25s ease both}
.modal-hd{display:flex;align-items:center;gap:10px;padding:18px 24px;border-bottom:1px solid #F3F4F6}
.modal-bd{padding:22px 24px}
.pod{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;flex:1;min-width:0}
.pod .stand{width:100%;border-radius:10px 10px 0 0;display:flex;align-items:flex-start;justify-content:center;padding-top:6px}
.ptab th.srt{cursor:pointer;user-select:none}
.ptab th.srt:hover{color:#EE4D2D}
</style>
</head>

function toast(msg,u){
  const t=$('toast');
  t.innerHTML='<span>'+esc(msg)+'</span>'+(u?'<button class="u" onclick="doUndo()">Undo</button>':'');
  t.style.display='flex';clearTimeout(t._x);t._x=setTimeout(()=>{t.style.display='none'},u?7000:2400);
}
function snap(){UNDO={entries:JSON.parse(JSON.stringify(ENTRIES)),people:JSON.parse(JSON.stringify(PEOPLE)),
  qs:JSON.parse(JSON.stringify(QUESTIONS)),acks:Object.keys(ACKS).reduce((o,k)=>{o[k]=Array.from(ACKS[k]);return o},{})}}
function doUndo(){
  if(!UNDO)return;
  ENTRIES.length=0;UNDO.entries.forEach(e=>ENTRIES.push(e));
  PEOPLE.length=0;UNDO.people.forEach(p=>PEOPLE.push(p));
  QUESTIONS.length=0;UNDO.qs.forEach(q=>QUESTIONS.push(q));
  Object.keys(ACKS).forEach(k=>delete ACKS[k]);
  Object.keys(UNDO.acks).forEach(k=>{ACKS[k]=new Set(UNDO.acks[k])});
  UNDO=null;$('toast').style.display='none';toast('Reverted');render();
}

function resetGate(){S.denied=null;S.reqOpen=false;S.reqDone=false;S.pickOpen=false;renderGate()}
function submitRequest(){
  const n=($('rqn').value||'').trim(),b=$('rqb').value,d=$('rqd').value,note=($('rqm').value||'').trim();
  if(!n){toast('Enter your full name');return}
  if(!b){toast('Pick your BPO');return}
  if(!d){toast('Pick your designation');return}
  REQUESTS.unshift({e:S.denied,n:n,bpo:b,desig:d,note:note,t:Date.now(),st:'pending'});
  S.reqDone=true;renderGate();
}
function togglePick(){S.pickOpen=!S.pickOpen;renderGate()}
function signIn(v){
  v=String(v||'').trim().toLowerCase();
  if(!v)return;
  const p=findPerson(v);
  /* not listed, or listed with nothing enabled — same outcome, same message */
  if(!p||!p.bpos.length){
    DENIED.unshift({e:v,t:Date.now()});
    S.denied=v;S.reqOpen=false;S.reqDone=false;renderGate();return;
  }
  S.me=p.e;S.denied=null;S.pickOpen=false;
  S.view=p.bpos.length>1?'__all':p.bpos[0];S.tab='home';
  if(!ACKS[p.e])ACKS[p.e]=new Set(SEED[p.e]||[]);
  logEv('login');
  $('gate').style.display='none';$('sidebar').style.display='flex';$('main').style.display='block';
  render();
}
function signOut(){S.me=null;S.denied=null;S.reqOpen=false;S.reqDone=false;S.adminOpen=S.superOpen=S.bpoOpen=false;S.gateErr='';S.open=null;closeModal();$('gate').style.display='flex';$('sidebar').style.display='none';$('main').style.display='none';renderGate()}

/* ─── traffic (WJ pattern) ─── */
function tfEvents(all){
  const s=scopeList();
  let evs=EVENTS.filter(v=>{
    if(all)return true;
    const p=findPerson(v.w);
    return p&&p.bpos.some(b=>s.indexOf(b)>=0);
  });
  if(S.tfUser)evs=evs.filter(v=>v.w===S.tfUser);
  return evs;
}
function tfChart(evs){
  const days=[],byDay={},whoByDay={};
  for(let i=13;i>=0;i--)days.push(dayKey(new Date(LASTEV.getTime()-i*864e5)));
  evs.filter(v=>v.k!=='publish'&&v.k!=='edit'&&v.k!=='draft'&&v.k!=='delete').forEach(v=>{
    const d=dayKey(new Date(v.t));
    if(!byDay[d])byDay[d]={views:0,who:{}};
    if(v.k==='view'||v.k==='ack')byDay[d].views++;
    byDay[d].who[v.w]=(byDay[d].who[v.w]||0)+1;
  });
  const today=dayKey(LASTEV);
  const mx=Math.max.apply(null,days.map(d=>(byDay[d]||{views:0}).views).concat([1]));
  return '<div style="display:flex;align-items:flex-end;gap:6px;height:150px;padding-top:6px">'+days.map(d=>{
    const b=byDay[d]||{views:0,who:{}};
    const names=Object.keys(b.who).sort((x,y)=>b.who[y]-b.who[x]).map(w=>nameOf(w)+(b.who[w]>1?' ('+b.who[w]+')':''));
    const lbl=new Date(d+'T12:00:00').toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short'});
    const isT=d===today;
    return '<div class="tf-bar">'+
      '<div class="tf-tip"><div style="font-weight:800;margin-bottom:4px">'+lbl+' · '+b.views+' action'+(b.views===1?'':'s')+'</div>'+
      '<div style="color:#D1D5DB">'+(names.length?esc(names.join(', ')):'No activity')+'</div><div class="ar"></div></div>'+
      '<div style="font-size:11px;font-weight:800;color:'+(b.views?(isT?'#EE4D2D':'#6B7280'):'#D1D5DB')+'">'+(b.views||'')+'</div>'+
      '<div style="width:100%;display:flex;align-items:flex-end;height:92px"><div style="width:100%;height:'+Math.max(Math.round(b.views/mx*100),b.views?4:0)+'%;background:'+(isT?'#EE4D2D':'#FFC5B4')+';border-radius:5px 5px 0 0;min-height:'+(b.views?3:0)+'px"></div></div>'+
      '<div style="font-size:9.5px;font-weight:'+(isT?800:600)+';color:'+(isT?'#EE4D2D':'#9CA3AF')+';white-space:nowrap">'+d.slice(8)+'/'+d.slice(5,7)+(isT?'<br>TODAY':'')+'</div></div>';
  }).join('')+'</div>';
}
function tfHours(evs){
  const byH=Array(24).fill(0);
  evs.filter(v=>v.k==='view'||v.k==='ack').forEach(v=>byH[new Date(v.t).getHours()]++);
  const mx=Math.max.apply(null,byH.concat([1]));
  return '<div style="display:flex;gap:3px">'+byH.map((c,h)=>{
    const p=Math.round(c/mx*100);
    const bg=c===0?'#F3F4F6':p>75?'#D6431F':p>50?'#EE4D2D':p>25?'#FFA48C':'#FFE0D7';
    const tc=c===0?'#D1D5DB':p>50?'#fff':'#8A2B14';
    return '<div class="heat"><div class="tf-tip"><div style="font-weight:800">'+String(h).padStart(2,'0')+':00 — '+String(h).padStart(2,'0')+':59</div><div style="color:#D1D5DB">'+c+' action'+(c===1?'':'s')+'</div><div class="ar"></div></div>'+
      '<div style="width:100%;height:30px;border-radius:5px;background:'+bg+';display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:800;color:'+tc+'">'+(c||'')+'</div>'+
      '<div style="font-size:8px;color:#9CA3AF;min-height:10px">'+(h%3===0?String(h).padStart(2,'0'):'')+'</div></div>';
  }).join('')+'</div>';
}
function tfDow(evs){
  const L=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'],byD=Array(7).fill(0);
  evs.filter(v=>v.k==='view'||v.k==='ack').forEach(v=>byD[new Date(v.t).getDay()]++);

  return '<div style="display:flex;gap:8px;align-items:flex-end;height:96px">'+byD.map((c,i)=>
    '<div class="tf-bar"><div class="tf-tip"><div style="font-weight:800">'+L[i]+'</div><div style="color:#D1D5DB">'+c+' views all-time</div><div class="ar"></div></div>'+
    '<div style="font-size:11px;font-weight:800;color:'+(c?'#26AA99':'#D1D5DB')+'">'+(c||'')+'</div>'+
    '<div style="width:100%;height:52px;display:flex;align-items:flex-end"><div style="width:100%;height:'+Math.max(Math.round(c/mx*100),c?5:0)+'%;background:'+(c?'#26AA99':'#F3F4F6')+';border-radius:5px 5px 0 0"></div></div>'+
    '<div style="font-size:11px;color:#6B7280;font-weight:700">'+L[i]+'</div></div>').join('')+'</div>';

function tfPodium(){
  const tot={};

      '<div class="stand" style="height:'+hts[i]+'px;background:linear-gradient(180deg,'+col[i]+','+col[i]+'bb)"><span style="font-size:15px;font-weight:900;color:#fff;opacity:.85;font-family:Nunito">'+(i+1)+'</span></div></div>').join('')+'</div>';

function setTfUser(v){S.tfUser=v;renderMain()}
function setTfSort(v){S.tfSort=v;renderMain()}
function tfTable(evs,peers){
  const today=dayKey(NOW),by={};
  peers.forEach(a=>{by[a.e]={p:a,total:0,today:0,last:0}});
  evs.forEach(v=>{
    if(!by[v.w])return;
    if(v.k==='view'||v.k==='ack'){by[v.w].total++;if(dayKey(new Date(v.t))===today)by[v.w].today++}
    if(v.t>by[v.w].last)by[v.w].last=v.t;
  });
  const parts=S.tfSort.split('-'),key=parts[0],dir=parts[1]==='asc'?1:-1;
  const rows=Object.keys(by).map(k=>by[k]).sort((a,b)=>{
    let r=0;
    if(key==='name')r=a.p.n.localeCompare(b.p.n);
    else if(key==='bpo')r=a.p.o.localeCompare(b.p.o);
    else if(key==='today')r=a.today-b.today;
    else if(key==='last')r=a.last-b.last;
    else r=a.total-b.total;
    return r*dir;
  });
  const th=(k,l)=>{
    const on=key===k,nd=on&&dir===-1?'asc':'desc';
    return '<th class="srt" onclick="setTfSort(\''+k+'-'+nd+'\')" style="'+(on?'color:#EE4D2D':'')+'">'+l+(on?(dir===-1?' ▼':' ▲'):'')+'</th>';
  };
  return '<table class="ptab"><thead><tr>'+th('name','Agent')+th('bpo','BPO')+th('total','Actions')+th('today','Today')+th('last','Last seen')+'</tr></thead><tbody>'+
    rows.map(r=>'<tr><td style="font-weight:500">'+esc(r.p.n)+'</td><td style="font-size:11.5px;color:#6B7280">'+esc(r.p.o)+'</td>'+
      '<td><span class="badge" style="background:'+(r.total?'#FFF1ED':'#FEF2F2')+';color:'+(r.total?'#EE4D2D':'#DC2626')+'">'+r.total+'</span></td>'+
      '<td style="font-size:12px">'+(r.today||'—')+'</td>'+
      '<td style="font-size:11.5px;color:#6B7280">'+(r.last?fmtT(r.last):'never')+'</td></tr>').join('')+
    '</tbody></table>';
}

  h+='<div class="card"><div style="font-family:Nunito;font-weight:800;font-size:15px;margin-bottom:2px">Last 14 days</div><div style="font-size:12px;color:#9CA3AF;margin-bottom:4px">Acknowledgement activity from the trackers. Hover a bar to see who.</div>'+tfChart(evs)+'</div>';

  h+='<div class="card" style="overflow-x:auto"><div style="font-family:Nunito;font-weight:800;font-size:15px;margin-bottom:10px">Activity by agent</div>'+tfTable(evs,peers)+'</div>';

/* ─── nudge: chat reminders ─── */
function remRows(){
  return scopeAgents().map(a=>{
    const miss=forBpo(a.o).filter(e=>!(ACKS[a.e]&&ACKS[a.e].has(e.id)));
    const m=MAIL[a.e]||{last:0};
    const days=m.last?Math.floor((NOW.getTime()-m.last)/864e5):999;
    let why='';
    if(!miss.length)why='Nothing outstanding';
    else if(days<REM.cooldown)why='Nudged '+days+'d ago';
    return {a:a,miss:miss,m:m,days:days,why:why,ok:!why};
  }).sort((x,y)=>(y.ok-x.ok)||(y.miss.length-x.miss.length));
}
function chatBody(r){
  return 'Hi '+r.a.n.split(' ')[0]+' — you have '+r.miss.length+' update'+(r.miss.length===1?'':'s')+
    ' waiting in the Agent Repository:\n'+r.miss.slice(0,5).map(e=>'· '+rid(e)+' — '+e.title).join('\n')+
    (r.miss.length>5?'\n· and '+(r.miss.length-5)+' more':'')+
    '\nPlease read and acknowledge them today. Thanks!';
}
function markNudged(emails){emails.forEach(e=>{if(!MAIL[e])MAIL[e]={last:0};MAIL[e].last=NOW.getTime()})}
function openCopy(text,label,emails){S.modal='copy';S.copyText=text;S.copyLabel=label;S.copyFor=emails||[];renderModal()}
function doCopy(){
  const ta=$('copyArea');
  if(ta){ta.focus();ta.select()}
  let ok=false;
  try{ok=document.execCommand('copy')}catch(err){ok=false}
  if(!ok&&navigator.clipboard&&ta){navigator.clipboard.writeText(ta.value).then(()=>{},()=>{});ok=true}
  if(S.copyFor&&S.copyFor.length){
    snap();markNudged(S.copyFor);
    REMLOG.unshift({t:Date.now(),by:S.me,n:S.copyFor.length,skipped:0,bpo:viewLabel()});
  }
  toast(ok?'Copied — paste into the agent chat':'Select the text and press Ctrl+C');
  closeModal();render();
}
function copyOne(email){
  const r=remRows().find(x=>x.a.e===email);
  if(!r)return;
  openCopy(chatBody(r),'Chat reminder for '+r.a.n,[email]);
}
function copyAllChat(){
  const go=remRows().filter(r=>r.ok);
  if(!go.length){toast('Nobody is eligible right now');return}
  const txt=go.map(r=>'── '+r.a.n+' ('+r.a.e+') ──\n'+chatBody(r)).join('\n\n');
  openCopy(txt,'Chat reminders for '+go.length+' agents',go.map(r=>r.a.e));
}
function setCooldown(v){REM.cooldown=parseInt(v,10)||0;renderMain();renderSide()}

function rNudge(){
  const rows=remRows(),go=rows.filter(r=>r.ok);
  const outstanding=rows.filter(r=>r.miss.length);
  const cooling=rows.filter(r=>!r.ok&&r.miss.length);
  let h=ctxBar()+'<div class="pg-title">Nudge</div><div class="pg-sub">Copy a reminder and paste it into the agent chat yourself — each person gets only their own outstanding list</div>';

  const bp=BPOS.filter(b=>$('rb-'+i+'-'+b.replace(/\s/g,'')).checked);

  if(findPerson(r.e)){
    snap();const p=findPerson(r.e);p.bpos=bp;r.st='approved';
    seedAcks();toast('Access restored for '+r.n,true);render();return;
  }

  r.st='approved';r.by=S.me;

}

/* ─── super admin: people ─── */
function parsePaste(text){
  const ok=[],bad=[];
  text.split(/\r?\n/).forEach(line=>{
    if(!line.trim())return;
    const c=(line.indexOf('\t')>=0?line.split('\t'):line.split(',')).map(x=>x.trim().replace(/^"|"$/g,''));
    if(/e-?mail/i.test(c[0])||/^name$/i.test(c[0]))return;
    const email=(c[0]||'').toLowerCase();
    if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)){bad.push(line.slice(0,60));return}
    const name=c[1]||email.split('@')[0];
    /* tolerant matching — 'In-House', 'InHouse', 'AsiaRecruit' etc. all resolve */
    const norm=s=>String(s||'').toLowerCase().replace(/[^a-z0-9]/g,'');
    const org=ORGS.find(o=>norm(o)===norm(c[2]))||(norm(c[2])?'':guessOrg(email));
    const role=ROLES.find(r=>norm(r)===norm(c[3]))||'Agent';
    let bpos=[];
    const raw=String(c[4]||'').toLowerCase(),nraw=norm(raw);
    const sup=nraw.indexOf('superadmin')>=0;
    const adm=sup||nraw.replace('superadmin','').indexOf('admin')>=0;
    if(raw.indexOf('all')>=0||nraw.indexOf('inhouse')>=0)bpos=BPOS.slice();
    else bpos=BPOS.filter(b=>nraw.indexOf(norm(b))>=0);
    if(!bpos.length&&org&&org!==IH)bpos=[org];
    if(!bpos.length&&org===IH)bpos=BPOS.slice();
    if(!org){bad.push(email+' — organisation missing or not recognised');return}
    if(!bpos.length){bad.push(email+' — no BPO access specified');return}
    ok.push({e:email,n:name,o:org,r:role,bpos:bpos,adm:adm,sup:sup});
  });
  return {ok:ok,bad:bad};
}
function setPaste(v){S.paste=v;renderMain()}
function pasteDiff(ok){
  const inc={};ok.forEach(p=>inc[p.e]=p);
  return {
    added:ok.filter(p=>!findPerson(p.e)),
    kept:ok.filter(p=>findPerson(p.e)),
    removed:PEOPLE.filter(p=>!inc[p.e])
  };

function applyPaste(){

  const d=pasteDiff(r.ok);
  const selfGone=d.removed.some(p=>p.e===S.me);
  let msg='Replace the entire namelist?\n\n'+d.added.length+' added\n'+d.kept.length+' kept or updated\n'+d.removed.length+' removed and locked out';
  if(d.removed.length)msg+='\n\nRemoved: '+d.removed.slice(0,8).map(p=>p.n).join(', ')+(d.removed.length>8?' and '+(d.removed.length-8)+' more':'');
  if(selfGone)msg+='\n\nYour own account is not in this list. It will be kept so you are not locked out.';
  if(!confirm(msg))return;
  snap();

  PEOPLE.length=0;
  r.ok.forEach(p=>PEOPLE.push(p));
  if(selfGone&&self)PEOPLE.push(self);
  seedAcks();seedMail();S.paste='';

async function afterAuth(user){
  const email=(user.email||'').toLowerCase();
  let snap=null;
  try{ snap=await A.getDoc(A.doc(A.db,'people',email)); }
  catch(err){ /* rules deny reads for unknown accounts — treat as not listed */ }
  if(!snap||!snap.exists()||!(snap.data().bpos||[]).length){
    try{ await A.addDoc(A.collection(A.db,'denied'),{email:email,at:Date.now()}); }catch(e){}
    await A.signOut(A.auth).catch(()=>{});
    S.deniedAuthEmail=email; S.denied=email; S.reqOpen=false; S.reqDone=false;
    $('gate').style.display='flex';$('sidebar').style.display='none';$('main').style.display='none';
    renderGate();
    return;
  }
  const d=snap.data();
  S.me=email; S.denied=null;
  S.view=d.bpos.length>1?'__all':d.bpos[0];
  S.tab='home';
  PEOPLE.length=0;

        date:x.date,title:x.title||'',body:x.body||'',by:x.sharedBy||'',tag:x.tag||'',cat:x.category||'',
        flow:x.flow||'',score:x.score||'',follow:x.follow||'',link:x.link||'',media:x.media||[],
        pb:x.publishedBy||'',pa:x.publishedAt||'',src:x.source||''});
    });
    ENTRIES.sort((a,b)=>String(b.date).localeCompare(String(a.date)));
  }catch(err){fail('Loading entries',err)}

  // acknowledgements
  ACKDOCS={};
  Object.keys(ACKS).forEach(k=>delete ACKS[k]);
  try{
    if(isAdmin()){
      const snap=await A.getDocs(A.collection(A.db,'acks'));
      snap.forEach(dd=>{ACKDOCS[dd.id]=dd.data().items||{}});
    }else{
      const dd=await A.getDoc(A.doc(A.db,'acks',S.me));
      ACKDOCS[S.me]=dd.exists()?(dd.data().items||{}):{};
    }
  }catch(err){fail('Loading acknowledgements',err)}
  Object.keys(ACKDOCS).forEach(k=>{ACKS[k]=new Set(Object.keys(ACKDOCS[k]))});
  if(!ACKS[S.me])ACKS[S.me]=new Set();

  // feedback — everyone loads their own, Super Admins load the full set
  FEEDBACK.length=0;
  try{
    const snap=await A.getDocs(isSuper()
      ?A.collection(A.db,'feedback')
      :A.query(A.collection(A.db,'feedback'),A.where('email','==',S.me)));
    snap.forEach(dd=>{const x=dd.data();FEEDBACK.push({fid:dd.id,e:x.email,n:x.name,o:x.org,bpo:x.bpo,cat:x.category,text:x.text,t:x.at})});
  }catch(err){/* rules may restrict — the page just shows nothing */}

  // namelist — admins only
  if(isAdmin()){
    try{
      const snap=await A.getDocs(A.collection(A.db,'people'));
      const mine=PEOPLE[0];
      PEOPLE.length=0;
      snap.forEach(dd=>{
        const x=dd.data();
        PEOPLE.push({e:dd.id,n:x.name||dd.id,o:x.org||IH,r:x.designation||'Agent',
                     bpos:x.bpos||[],adm:!!x.adm,sup:!!x.sup});
      });
      if(!findPerson(S.me))PEOPLE.push(mine);
    }catch(err){fail('Loading the namelist',err)}
    Object.keys(MAIL).forEach(k=>delete MAIL[k]);
    seedMail();
    try{
      const snap=await A.getDocs(A.query(A.collection(A.db,'events'),A.orderBy('at','desc'),A.limit(1000)));
      EVENTS.length=0;
      snap.forEach(dd=>{const x=dd.data();EVENTS.push({t:x.at,k:x.k,w:x.who,id:x.entryId||null,b:x.bpo||null})});
    }catch(err){/* index may still be building — traffic just shows acks */}
    try{
      const snap=await A.getDocs(A.query(A.collection(A.db,'nudges'),A.orderBy('at','desc'),A.limit(50)));
      REMLOG.length=0;
      snap.forEach(dd=>{const x=dd.data();REMLOG.push({t:x.at,by:x.by,n:x.n,bpo:x.bpo});
        (x.to||[]).forEach(e=>{if(MAIL[e])MAIL[e].last=Math.max(MAIL[e].last||0,x.at)});});
    }catch(err){}
    try{
      const snap=await A.getDocs(A.collection(A.db,'questions'));
      QUESTIONS.length=0;
      snap.forEach(dd=>{const x=dd.data();QUESTIONS.push({qid:dd.id,id:x.entryId,by:x.by,q:x.text})});
    }catch(err){}
  }

  // acknowledgement timestamps become the traffic baseline
  Object.keys(ACKDOCS).forEach(em=>{
    const items=ACKDOCS[em];
    Object.keys(items).forEach(id=>{
      const t=items[id];
      if(t)EVENTS.push({t:t,k:'ack',w:em,id:id});
    });
  });
  EVENTS.sort((a,b)=>b.t-a.t);
  recalcLast();

  if(isSuper()){
    try{
      const snap=await A.getDocs(A.collection(A.db,'requests'));
      REQUESTS.length=0;
      snap.forEach(dd=>{const x=dd.data();REQUESTS.push({rid:dd.id,e:x.email,n:x.name,bpo:x.bpo,
        desig:x.designation,note:x.note,t:x.at,st:x.status,by:x.decidedBy})});
      REQUESTS.sort((a,b)=>b.t-a.t);
    }catch(err){}
    try{
      const snap=await A.getDocs(A.query(A.collection(A.db,'denied'),A.orderBy('at','desc'),A.limit(50)));
      DENIED.length=0;
      snap.forEach(dd=>{const x=dd.data();DENIED.push({e:x.email,t:x.at})});
    }catch(err){}
    try{
      const dd=await A.getDoc(A.doc(A.db,'meta','orphans'));
      ORPHANS=dd.exists()?(dd.data().rows||[]).map(r=>({e:r.email,ids:r.ids,why:r.why})):[];
    }catch(err){}
  }
}

/* ─── undo: one action, one inverse ─── */
let UNDOFN=null;
function snap(){/* superseded — each mutation registers its own inverse */}
function setUndo(fn){UNDOFN=fn}
async function doUndo(){
  if(!UNDOFN)return;
  const fn=UNDOFN; UNDOFN=null;
  $('toast').style.display='none';
  try{await fn();toast('Reverted');}catch(err){fail('Undo',err)}
  render();
}

/* ─── one-time data import, super admin only ─── */
let IMPBUSY=false;
function setImp(v){S.imp=v}
function rImport(){
  const n=(S.impLog||[]).length;
  let h='<div class="pg-title">Import data</div><div class="pg-sub">A one-time load of the two tracker exports. You should only ever need this once.</div>';
  h+='<div class="card"><div style="font-family:Nunito;font-weight:800;font-size:15px;margin-bottom:6px">Paste seed-data.json</div>'+
    '<div style="font-size:12.5px;color:#6B7280;line-height:1.65;margin-bottom:12px">Open <b>seed-data.json</b> on your computer in Notepad or TextEdit, select everything, copy, and paste it below. '+
    'It contains your namelist, the 49 entries and 950 acknowledgements.<br>Keep that file off the internet — it holds real email addresses.</div>'+
    '<textarea class="inp" id="impbox" rows="6" style="font-family:monospace;font-size:11.5px;resize:vertical" placeholder=\'{ "entries": [ ... ], "people": [ ... ], "acks": { ... } }\' oninput="setImp(this.value)">'+esc(S.imp||'')+'</textarea>';
  let parsed=null,err='';
  if((S.imp||'').trim()){
    try{
      parsed=JSON.parse(S.imp);
      if(!parsed.people||!parsed.entries)throw new Error('This does not look like seed-data.json — no people or entries found.');
    }catch(e){err=e.message}
  }
  if(err)h+='<div style="background:#FEF2F2;color:#B91C1C;font-size:12.5px;padding:11px 14px;border-radius:10px;margin-top:12px">'+esc(err)+'</div>';
  if(parsed){
    const pairs=Object.keys(parsed.acks||{}).reduce((t,k)=>t+Object.keys(parsed.acks[k]).length,0);
    h+='<div style="display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin-top:12px">'+
      [['People',parsed.people.length],['Entries',parsed.entries.length],
       ['Ack records',Object.keys(parsed.acks||{}).length],['Acknowledgements',pairs]]
      .map(x=>'<div style="background:#F9FAFB;border-radius:10px;padding:10px 13px"><div style="font-size:10.5px;font-family:Nunito;font-weight:800;color:#6B7280;letter-spacing:.4px">'+x[0].toUpperCase()+'</div>'+
        '<div style="font-size:19px;font-weight:900;font-family:Nunito">'+x[1]+'</div></div>').join('')+'</div>'+
      '<div style="display:flex;gap:9px;margin-top:14px;align-items:center">'+
      '<button class="btn btn-primary" onclick="runImport()"'+(IMPBUSY?' disabled':'')+'>'+(IMPBUSY?'Importing…':'Import into Firebase')+'</button>'+
      '<button class="btn btn-outline" onclick="setImp(\'\');renderMain()">Clear</button>'+
      '<span style="font-size:12px;color:#9CA3AF">Safe to run twice — it overwrites rather than duplicating.</span></div>';
  }
  h+='</div>';
  if(n)h+='<div class="card" style="padding:8px 0"><div style="font-family:Nunito;font-weight:800;font-size:15px;padding:10px 14px 6px">Import log</div>'+
    S.impLog.map(l=>'<div class="log"><span class="ic" style="background:'+(l.ok?'#ECFDF5':'#FEF2F2')+';color:'+(l.ok?'#059669':'#DC2626')+'">'+(l.ok?'✓':'!')+'</span>'+
      '<div style="flex:1;font-size:12.5px">'+esc(l.t)+'</div></div>').join('')+'</div>';
  return h;
}
function impSay(t,ok){S.impLog=S.impLog||[];S.impLog.unshift({t:t,ok:ok!==false});renderMain()}

async function runImport(){
  if(IMPBUSY)return;
  let d;
  try{d=JSON.parse(S.imp)}catch(e){toast('That is not valid JSON');return}
  if(!confirm('Import '+d.people.length+' people and '+d.entries.length+' entries into Firebase?\n\nExisting records with the same ID are overwritten.'))return;
  IMPBUSY=true;S.impLog=[];renderMain();
  const chunk=async(items,fn,label)=>{
    let b=A.writeBatch(A.db),n=0,total=0;
    for(const it of items){
      fn(b,it);
      if(++n===400){await b.commit();total+=n;b=A.writeBatch(A.db);n=0}
    }
    if(n){await b.commit();total+=n}
    impSay(label+': '+total);
    return total;
  };
  try{
    await chunk(d.people,(b,x)=>b.set(A.doc(A.db,'people',x.email),
      {name:x.name,org:x.org,designation:x.designation,bpos:x.bpos,adm:!!x.adm,sup:!!x.sup,
       addedBy:S.me,addedAt:Date.now()},{merge:true}),'People');

    await chunk(d.entries,(b,x)=>{
      const o={ref:x.ref,module:x.module,audience:x.audience,status:x.status||'pub',date:x.date,
        title:x.title||'',body:x.body||'',category:x.category||'',tag:x.tag||'',flow:x.flow||'',
        score:x.score||'',follow:x.follow||'',sharedBy:x.sharedBy||'',link:x.link||'',media:x.media||[],
        source:x.source||'',publishedBy:S.me,publishedAt:new Date(x.date+'T09:00:00').getTime()};
      b.set(A.doc(A.db,'entries',x.id),o,{merge:true});
    },'Entries');

    const ackRows=Object.keys(d.acks||{}).map(e=>({e:e,items:d.acks[e]}));
    await chunk(ackRows,(b,x)=>b.set(A.doc(A.db,'acks',x.e),{email:x.e,items:x.items},{merge:true}),'Acknowledgement records');

    const counters={};
    d.entries.forEach(x=>{
      const k=x.module+'_'+x.audience, n=parseInt(String(x.ref).split('-')[1],10);
      if(!isNaN(n))counters[k]=Math.max(counters[k]||0,n);
    });
    await chunk(Object.keys(counters).map(k=>({k:k,n:counters[k]})),
      (b,x)=>b.set(A.doc(A.db,'counters',x.k),{n:x.n}),'Counters');

    if(d.orphans){
      await A.setDoc(A.doc(A.db,'meta','orphans'),{rows:d.orphans,importedAt:Date.now()});
      impSay('Unmatched acknowledgement rows: '+d.orphans.length);
    }
    await A.setDoc(A.doc(A.db,'changelog',APP_V),
      {v:APP_V,date:new Date().toISOString().slice(0,10),by:S.me,
       notes:['Data imported from the two tracker exports']},{merge:true});

    IMPBUSY=false;S.imp='';
    impSay('Import finished — reloading');
    await loadAll();
    toast('Import complete');
    render();
  }catch(err){
    IMPBUSY=false;
    impSay('Failed: '+(err.message||err),false);
    fail('Import',err);
  }
}

/* ─── writes ─── */
function logEv(k,id,b){
  if(!READY||!S.me)return;
  const ev={k:k,who:S.me,entryId:id||null,bpo:b||null,at:Date.now()};
  EVENTS.unshift({t:ev.at,k:k,w:S.me,id:id||null,b:b||null});
  A.addDoc(A.collection(A.db,'events'),ev).catch(()=>{});
}

async function ack(id,ev){
  if(ev)ev.stopPropagation();
  if(mine().has(id))return;
  const t=Date.now();
  mine().add(id);
  if(!ACKDOCS[S.me])ACKDOCS[S.me]={};
  ACKDOCS[S.me][id]=t;
  render();
  try{
    await A.setDoc(A.doc(A.db,'acks',S.me),{email:S.me,items:{[id]:t}},{merge:true});
    logEv('ack',id);
    setUndo(async()=>{
      mine().delete(id); delete ACKDOCS[S.me][id];
      await A.updateDoc(A.doc(A.db,'acks',S.me),{['items.'+id]:A.deleteField()});
    });
    toast('Acknowledged',true);
  }catch(err){mine().delete(id);render();fail('Acknowledging',err)}
}

async function askQ(id,ev){
  if(ev)ev.stopPropagation();
  const text=prompt('What is your question about this entry?');
  if(!text||!text.trim())return;
  try{
    const r=await A.addDoc(A.collection(A.db,'questions'),{entryId:id,by:S.me,text:text.trim(),at:Date.now()});
    QUESTIONS.push({qid:r.id,id:id,by:S.me,q:text.trim()});
    setUndo(async()=>{
      await A.deleteDoc(A.doc(A.db,'questions',r.id));
      const i=QUESTIONS.findIndex(q=>q.qid===r.id); if(i>=0)QUESTIONS.splice(i,1);
    });
    toast('Question sent',true);render();
  }catch(err){fail('Sending the question',err)}
}

async function nextIdFB(m,aud){
  const key=m+'_'+aud;
  const n=await A.runTransaction(A.db,async tx=>{
    const ref=A.doc(A.db,'counters',key);
    const d=await tx.get(ref);
    const next=(d.exists()?(d.data().n||0):0)+1;
    tx.set(ref,{n:next});
    return next;
  });
  return {ref:m+'-'+n,id:(PFX[aud]||'X')+'-'+m+'-'+n};
}

async function saveEntry(publish){
  const d=S.edit;
  if(!d.title.trim()||!d.body.trim()||!d.date){S.err='Title, summary and date are all required.';renderMain();return}
  const wasNew=S.editNew;
  try{
    let id=d.id, ref=d.ref;
    if(wasNew){const n=await nextIdFB(d.m,d.aud);id=n.id;ref=n.ref}
    const payload={ref:ref,module:d.m,audience:d.aud,status:publish?'pub':'draft',date:d.date,
      title:d.title,body:d.body,category:d.cat||'',tag:d.tag||'',flow:d.flow||'',score:d.score||'',
      follow:d.follow||'',sharedBy:d.by||'',link:d.link||'',media:d.media||[],
      publishedBy:S.me,publishedAt:Date.now(),source:d.src||''};
    const before=wasNew?null:Object.assign({},ENTRIES.find(e=>e.id===id));
    await A.setDoc(A.doc(A.db,'entries',id),payload,{merge:true});
    const local={id:id,ref:ref,m:d.m,aud:d.aud,st:payload.status,date:d.date,title:d.title,body:d.body,
      by:d.by,tag:d.tag,cat:d.cat,flow:d.flow,score:d.score,follow:d.follow,link:d.link,
      media:d.media,pb:S.me,pa:payload.publishedAt,src:d.src};
    if(wasNew)ENTRIES.unshift(local); else ENTRIES[ENTRIES.findIndex(e=>e.id===id)]=local;
    logEv(publish?(wasNew?'publish':'edit'):'draft',id,d.aud);
    S.edit=null;S.orig=null;
    setUndo(async()=>{
      if(wasNew){await A.deleteDoc(A.doc(A.db,'entries',id));const i=ENTRIES.findIndex(e=>e.id===id);if(i>=0)ENTRIES.splice(i,1)}
      else{await A.setDoc(A.doc(A.db,'entries',id),{status:before.st,title:before.title,body:before.body},{merge:true});
           ENTRIES[ENTRIES.findIndex(e=>e.id===id)]=before}
    });
    toast((publish?'Published ':'Saved ')+ref,true);render();
  }catch(err){fail('Saving the entry',err)}
}

async function setStatus(id,st,label){
  const e=ENTRIES.find(x=>x.id===id),prev=e.st;
  try{
    await A.updateDoc(A.doc(A.db,'entries',id),{status:st,publishedBy:S.me,publishedAt:Date.now()});
    e.st=st;e.pb=S.me;
    logEv(st==='pub'?'publish':'unpublish',id,e.aud);
    setUndo(async()=>{await A.updateDoc(A.doc(A.db,'entries',id),{status:prev});e.st=prev});
    toast(label,true);render();
  }catch(err){fail('Updating the entry',err)}
}
function unpublish(id){setStatus(id,'draft','Unpublished')}
function publishNow(id){const e=ENTRIES.find(x=>x.id===id);setStatus(id,'pub','Published '+rid(e))}

async function delEntry(id){
  const e=ENTRIES.find(x=>x.id===id);
  const holders=Object.keys(ACKDOCS).filter(em=>ACKDOCS[em][id]);
  if(!confirm('Delete this entry?\n\n'+holders.length+' acknowledgement(s) will no longer point at anything.'))return;
  const copy=Object.assign({},e);
  try{
    await A.deleteDoc(A.doc(A.db,'entries',id));
    logEv('delete',id,e.aud);
    ENTRIES.splice(ENTRIES.findIndex(x=>x.id===id),1);
    setUndo(async()=>{
      await A.setDoc(A.doc(A.db,'entries',id),{ref:copy.ref,module:copy.m,audience:copy.aud,status:copy.st,
        date:copy.date,title:copy.title,body:copy.body,category:copy.cat||'',tag:copy.tag||'',
        sharedBy:copy.by||'',link:copy.link||'',media:copy.media||[],publishedBy:S.me,publishedAt:Date.now()});
      ENTRIES.unshift(copy);
    });
    toast('Entry deleted',true);render();
  }catch(err){fail('Deleting the entry',err)}
}

/* ─── namelist ─── */
function personDoc(p){return {name:p.n,org:p.o,designation:p.r,bpos:p.bpos,adm:!!p.adm,sup:!!p.sup,
  addedBy:S.me,addedAt:Date.now()}}
async function writePerson(p){await A.setDoc(A.doc(A.db,'people',p.e),personDoc(p),{merge:true})}

async function addPerson(){
  const e=($('pe').value||'').trim().toLowerCase(),n=($('pn').value||'').trim();
  if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(e)){toast('Enter a valid email address');return}
  if(findPerson(e)){toast('That address is already on the namelist');return}
  const bp=BPOS.filter(b=>$('pb-'+b.replace(/\s/g,'')).checked);
  if(!bp.length){toast('Tick at least one BPO or they cannot sign in');return}
  const sup=$('pb-SUP').checked, adm=$('pb-ADM').checked||sup;
  if(sup&&!confirm('Grant Super Admin?\n\nThey will be able to add and remove anyone, including you.'))return;
  const p={e:e,n:n||e.split('@')[0],o:$('po').value,r:$('pr').value,bpos:bp,adm:adm,sup:sup};
  try{
    await writePerson(p);PEOPLE.push(p);seedMail();
    setUndo(async()=>{await A.deleteDoc(A.doc(A.db,'people',e));
      const i=PEOPLE.findIndex(x=>x.e===e);if(i>=0)PEOPLE.splice(i,1)});
    toast('Added to the namelist',true);render();
  }catch(err){fail('Adding the person',err)}
}

async function applyPaste(){
  const r=parsePaste(S.paste);
  if(!r.ok.length){toast('Nothing valid to import');return}
  const inc={};r.ok.forEach(x=>inc[x.e]=x);
  const removed=PEOPLE.filter(x=>!inc[x.e]);
  const selfGone=removed.some(x=>x.e===S.me);
  let msg='Replace the entire namelist?\n\n'+r.ok.filter(x=>!findPerson(x.e)).length+' added\n'+
    r.ok.filter(x=>findPerson(x.e)).length+' kept or updated\n'+removed.length+' removed and locked out';
  if(selfGone)msg+='\n\nYour own account is not in this list. It will be kept.';
  if(!confirm(msg))return;
  const backup=PEOPLE.map(x=>Object.assign({},x));
  try{
    let batch=A.writeBatch(A.db),n=0;
    for(const x of removed){
      if(x.e===S.me)continue;
      batch.delete(A.doc(A.db,'people',x.e));
      if(++n===400){await batch.commit();batch=A.writeBatch(A.db);n=0}
    }
    for(const x of r.ok){
      batch.set(A.doc(A.db,'people',x.e),personDoc(x),{merge:true});
      if(++n===400){await batch.commit();batch=A.writeBatch(A.db);n=0}
    }
    if(n)await batch.commit();
    const self=findPerson(S.me);
    PEOPLE.length=0;r.ok.forEach(x=>PEOPLE.push(x));
    if(selfGone&&self)PEOPLE.push(self);
    seedMail();S.paste='';
    setUndo(async()=>{
      let b2=A.writeBatch(A.db),m=0;
      for(const x of backup){b2.set(A.doc(A.db,'people',x.e),personDoc(x),{merge:true});
        if(++m===400){await b2.commit();b2=A.writeBatch(A.db);m=0}}
      if(m)await b2.commit();
      PEOPLE.length=0;backup.forEach(x=>PEOPLE.push(x));
    });
    toast('Namelist replaced — '+PEOPLE.length+' people',true);render();
  }catch(err){fail('Replacing the namelist',err)}
}

async function patchPerson(email,patch,label){
  const p=findPerson(email),before={bpos:p.bpos.slice(),adm:p.adm,sup:p.sup,r:p.r,o:p.o};
  Object.assign(p,patch);
  try{
    await A.updateDoc(A.doc(A.db,'people',email),
      {bpos:p.bpos,adm:!!p.adm,sup:!!p.sup,designation:p.r,org:p.o});
    setUndo(async()=>{Object.assign(p,before);
      await A.updateDoc(A.doc(A.db,'people',email),
        {bpos:before.bpos,adm:before.adm,sup:before.sup,designation:before.r,org:before.o})});
    toast(label,true);render();
  }catch(err){Object.assign(p,before);fail('Updating access',err)}
}
function togBpo(email,b){
  const p=findPerson(email),i=p.bpos.indexOf(b),bpos=p.bpos.slice();
  if(i>=0)bpos.splice(i,1); else bpos.push(b);
  if(email===S.me&&!bpos.length){toast('You cannot remove your own last BPO');return}
  patchPerson(email,{bpos:bpos},'Access updated');
  if(email===S.me)S.view=bpos.length>1?'__all':bpos[0];
}
function togSec(email,k){
  const p=findPerson(email);
  if(k==='sup'&&!p.sup&&!confirm('Grant Super Admin to '+p.n+'?\n\nThey will be able to add and remove anyone, including you.'))return;
  if(email===S.me&&k==='sup'&&p.sup){toast('You cannot remove your own Super Admin access');return}
  if(email===S.me&&k==='adm'&&p.adm&&!p.sup){toast('You cannot remove your own Admin access');return}
  const patch={};patch[k]=!p[k];
  if(k==='sup'&&patch.sup)patch.adm=true;
  if(k==='adm'&&!patch.adm)patch.sup=false;
  patchPerson(email,patch,'Section access updated');
}
function setRole(email,r){patchPerson(email,{r:r},'Designation updated')}
function setOrg(email,o){patchPerson(email,{o:o},'Organisation updated')}
async function removePerson(email){
  if(email===S.me){toast('You cannot remove your own access');return}
  if(!confirm('Remove '+email+'?\n\nThey lose access immediately. Acknowledgement history is kept.'))return;
  const p=Object.assign({},findPerson(email));
  try{
    await A.deleteDoc(A.doc(A.db,'people',email));
    PEOPLE.splice(PEOPLE.findIndex(x=>x.e===email),1);
    setUndo(async()=>{await writePerson(p);PEOPLE.push(p)});
    toast('Access removed',true);render();
  }catch(err){fail('Removing the person',err)}
}

/* ─── access requests ─── */
async function submitRequest(){
  const n=($('rqn').value||'').trim(),b=$('rqb').value,d=$('rqd').value,note=($('rqm').value||'').trim();
  if(!n){toast('Enter your full name');return}
  if(!b){toast('Pick your BPO');return}
  if(!d){toast('Pick your designation');return}
  try{
    // the requester is signed out by now, so sign back in just long enough to write
    const provider=new A.GoogleAuthProvider();
    provider.setCustomParameters({login_hint:S.denied,prompt:'none'});
    await A.signInWithPopup(A.auth,provider).catch(()=>{});
    await A.addDoc(A.collection(A.db,'requests'),
      {email:S.denied,name:n,bpo:b,designation:d,note:note,at:Date.now(),status:'pending'});
    await A.signOut(A.auth).catch(()=>{});
  }catch(err){/* the request is best-effort; still confirm to the person */}
  S.reqDone=true;renderGate();
}
async function approveReq(i){
  const r=REQUESTS[i];
  const bp=BPOS.filter(b=>$('rb-'+i+'-'+b.replace(/\s/g,'')).checked);
  if(!bp.length){toast('Tick at least one BPO before approving');return}
  const p={e:r.e,n:r.n,o:$('ro-'+i).value,r:$('rr-'+i).value,bpos:bp,adm:false,sup:false};
  try{
    await writePerson(p);
    await A.updateDoc(A.doc(A.db,'requests',r.rid),{status:'approved',decidedBy:S.me,decidedAt:Date.now()});
    if(!findPerson(p.e))PEOPLE.push(p); else Object.assign(findPerson(p.e),p);
    r.st='approved';r.by=S.me;seedMail();
    toast(r.n+' approved and added to the namelist');render();
  }catch(err){fail('Approving',err)}
}
async function rejectReq(i){
  const r=REQUESTS[i];
  if(!confirm('Reject this request?\n\n'+r.e+' stays locked out.'))return;
  try{
    await A.updateDoc(A.doc(A.db,'requests',r.rid),{status:'rejected',decidedBy:S.me,decidedAt:Date.now()});
    r.st='rejected';r.by=S.me;toast('Request rejected');render();
  }catch(err){fail('Rejecting',err)}
}

/* ─── nudge ─── */
async function doCopy(){
  const ta=$('copyArea');
  if(ta){ta.focus();ta.select()}
  let ok=false;
  try{ok=document.execCommand('copy')}catch(err){ok=false}
  if(!ok&&navigator.clipboard&&ta){navigator.clipboard.writeText(ta.value).then(()=>{},()=>{});ok=true}
  const to=(S.copyFor||[]).slice();
  closeModal();
  if(to.length){
    const rec={by:S.me,n:to.length,to:to,bpo:viewLabel(),at:Date.now()};
    markNudged(to);
    REMLOG.unshift({t:rec.at,by:S.me,n:to.length,bpo:rec.bpo});
    try{await A.addDoc(A.collection(A.db,'nudges'),rec)}catch(err){fail('Recording the nudge',err)}
  }
  toast(ok?'Copied — paste into the agent chat':'Select the text and press Ctrl+C');
  render();
}


if(!READY)renderGate();
</script>
